[package]
name = "oasis-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "oasis_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "oasis-fastpath"
path = "src/bin/oasis_fastpath.rs"

[dependencies]
anyhow = "1"
hex = "0.4"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
