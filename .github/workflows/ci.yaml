name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python safety and accounting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        run: python -m pip install uv==0.12.23
      - name: Install Python dependencies
        run: make install
      - name: Set up Node.js for dashboard syntax validation
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.2.0
        with:
          node-version: "22.14.0"
      - name: Build Rust fastpath shared library
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --locked --manifest-path crates/Cargo.toml --release
      - name: Run Python gate
        run: make python-check frontend-check security-check

  rust:
    name: Rust fastpath kernel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Run Rust gate
        run: make rust-check

  profit-deployment:
    name: Profit-engine deployment confinement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@34e1148760b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        run: python -m pip install uv==0.12.23
      - name: Install Python dependencies
        run: make install
      - name: Verify compose policy and key-volume confinement
        run: make profit-deployment-check
      - name: Build profit-engine image
        run: docker build -f deploy/profit-engine/Dockerfile -t oasis-profit-engine:ci .

  contracts:
    name: Solidity hook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.4
      - name: Install locked contract dependencies
        run: make contract-install
      - name: Run contract gate
        run: make contract-check
      - name: Set up Python for contract analysis
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install locked security tools
        run: make install
      - name: Run contract security gate
        run: make contract-security-check
      - name: Verify Python-Solidity ABI and Anvil E2E parity
        run: OASIS_REQUIRE_FOUNDRY_ARTIFACTS=1 .venv/bin/python -m pytest tests/unit/test_atomic_bundle_and_revert_budget.py tests/unit/test_intent_vault_and_uniswapx_client.py tests/unit/test_atomic_intent_authority.py tests/unit/test_profit_engine_readiness_and_anvil.py -q
