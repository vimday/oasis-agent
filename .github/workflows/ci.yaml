name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python safety and accounting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Set up uv
        run: python -m pip install uv==0.13.9
      - name: Install Python dependencies
        run: make install
      - name: Set up Node.js for dashboard syntax validation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - name: Build Rust fastpath shared library
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --locked --manifest-path crates/Cargo.toml --release
      - name: Set up Foundry for calldata parity
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.10.0
      - name: Install locked contract dependencies
        run: make contract-install
      - name: Run Python gate
        run: make python-check frontend-check security-check

  rust:
    name: Rust fastpath kernel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Run Rust gate
        run: make rust-check

  profit-deployment:
    name: Profit-engine deployment confinement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Set up uv
        run: python -m pip install uv==0.13.9
      - name: Install Python dependencies
        run: make install
      - name: Verify compose policy and key-volume confinement
        run: make profit-deployment-check
      - name: Build profit-engine image
        run: docker build -f deploy/profit-engine/Dockerfile -t oasis-profit-engine:ci .

  contracts:
    name: Solidity hook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.10.0
      - name: Install locked contract dependencies
        run: make contract-install
      - name: Run contract gate
        run: make contract-check
      - name: Set up Python for contract analysis
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Set up uv
        run: python -m pip install uv==0.13.9
      - name: Install locked security tools
        run: make install
      - name: Run contract security gate
        run: make contract-security-check
      - name: Verify Python-Solidity ABI and Anvil E2E parity
        run: OASIS_REQUIRE_FOUNDRY_ARTIFACTS=1 .venv/bin/python -m pytest tests/unit/test_atomic_bundle_and_revert_budget.py tests/unit/test_intent_vault_and_uniswapx_client.py tests/unit/test_atomic_intent_authority.py tests/unit/test_profit_engine_readiness_and_anvil.py -q
