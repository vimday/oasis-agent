[project]
name = "oasis-agent"
version = "0.1.0"
description = "Reproducible multi-chain EVM Uniswap v4 research and guarded execution toolkit"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "web3>=7.16,<8",
    # Security floors also protect installs that bypass the hashed lockfile.
    "aiohttp>=3.14.3,<4",
    "idna>=3.15,<4",
    "requests>=2.34.2,<3",
    "urllib3>=2.7.0,<3",
    "eth-abi>=5.1",
    "eth-utils>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "coverage>=7.16",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "setuptools>=82",
    "wheel>=0.46",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["oasis_agent"]
