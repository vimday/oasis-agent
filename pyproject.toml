[project]
name = "oasis-agent"
version = "0.1.0"
description = "Reproducible multi-chain EVM Uniswap v4 research and guarded execution toolkit"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "web3>=7.16,<8",
    # Security floors also protect installs that bypass the hashed lockfile.
    "aiohttp>=3.14.3,<4",
    # Local observation API server (P0-P3 dashboard backend).
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "idna>=3.15,<4",
    "requests>=2.34.2,<3",
    "urllib3>=2.7.0,<3",
    "eth-abi>=5.1",
    "eth-utils>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "coverage>=7.16",
    "bandit>=1.9.4",
    "detect-secrets==1.5.0",
    "pip-audit>=2.10.1",
    "slither-analyzer>=0.10",
    "setuptools>=82",
    "wheel>=0.46",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"oasis_agent.server" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # starlette's TestClient still routes through httpx; the httpx2 migration
    # warning is noise for these tests.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # starlette 1.x internal anyio alias deprecation.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Expanded Python 3.12 rule set. Every rule below must stay green
# on `ruff check`; removing a rule requires a justification in the commit.
select = [
    "E",      # pycodestyle errors (incl. E501 line length)
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade (incl. StrEnum, UP042)
    "B",      # flake8-bugbear (incl. B905 zip strict)
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "PLC",    # pylint convention (incl. PLC0415 import at top-level)
    "PLE",    # pylint errors
    "PLW",    # pylint warnings (incl. PLW0108 needless lambda)
    "PERF",   # performance lints (incl. PERF401 list.extend)
    "RUF",    # ruff-specific (incl. RUF005 unpacking, RUF002 ambiguous chars)
    "ASYNC",  # flake8-async
    "FA",     # flake8-future-annotations
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "FURB",   # refurb-style modernization
    "BLE",    # flake8-blind-except
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["oasis_agent"]
