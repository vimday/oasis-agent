[project]
name = "oasis-agent"
version = "0.1.0"
description = "Reproducible Robinhood Chain Uniswap v4 research and guarded execution toolkit"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
oasis-agent = "oasis_agent.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["oasis_agent"]
